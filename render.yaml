# Render Blueprint — deploys Tonight's Movie as a free web service.
# Docs: https://render.com/docs/blueprint-spec
#
# Render injects PORT automatically; HOST=0.0.0.0 makes the server
# reachable from outside its container (local default is 127.0.0.1).
# Note: the free plan has an ephemeral disk — the Letterboxd cache
# (data/watchlists/) is rebuilt on demand after each restart, which
# is fine since it self-warms.

services:
  - type: web
    name: tonights-movie
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "20"
      # Memory headroom on the free 512 MB plan: with the small
      # concurrency below, a 384 MB V8 heap leaves room for undici
      # buffers and prevents "JavaScript heap out of memory" crashes.
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: FILM_CONCURRENCY
        value: "16"
      - key: PAGE_CONCURRENCY
        value: "6"
